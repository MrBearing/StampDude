name: ci_jazzy

on:
  push:
    branches:
      - "jazzy"
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  ci:
    runs-on: ubuntu-latest
    if: |
      ((github.event.action == 'labeled') && (github.event.label.name == 'TESTING') && (github.base_ref == 'jazzy' )) ||
      ((github.event.action == 'synchronize') && (github.base_ref == 'jazzy') && contains(github.event.pull_request.labels.*.name, 'TESTING')) ||
      (github.ref_name == 'jazzy')
    container:
      image: osrf/ros:jazzy-desktop
      options: --privileged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - name: Build and Test
        shell: bash
        run: |
          # Source ROS environment
          source /opt/ros/jazzy/setup.bash
          
          # Update package list (ignore errors)
          apt-get update || true
          
          # Install dependencies using rosdep
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y
          
          # Build packages
          colcon build --packages-select stamp_dude stamp_dude_bringup
          
          # Run tests
          colcon test --packages-select stamp_dude stamp_dude_bringup
          colcon test-result --all --verbose
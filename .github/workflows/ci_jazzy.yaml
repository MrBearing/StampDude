name: ci_jazzy

on:
  push:
    branches:
      - "jazzy"
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    if: |
      ((github.event.action == 'labeled') && (github.event.label.name == 'TESTING') && (github.base_ref == 'jazzy' )) ||
      ((github.event.action == 'synchronize') && (github.base_ref == 'jazzy') && contains(github.event.pull_request.labels.*.name, 'TESTING')) ||
      (github.ref_name == 'jazzy')
    container:
      image: osrf/ros:${{ matrix.ros_distribution }}-desktop
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ros_distribution: [jazzy]
    steps:
      - uses: actions/checkout@v3
      # Fix for expired ROS GPG key issue
      # The ROS GPG key sometimes expires and causes apt update failures
      # This step ensures we have the latest valid GPG key before installing ROS packages
      - name: Update ROS GPG Key
        run: |
          # Remove all existing ROS repository configurations to avoid conflicts
          sudo rm -f /etc/apt/sources.list.d/ros*.list
          # Remove old/expired GPG keys
          sudo rm -f /etc/apt/keyrings/ros-archive-keyring.gpg
          sudo rm -f /usr/share/keyrings/ros2-latest-archive-keyring.gpg
          # Download the latest GPG key from official ROS repository
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc -o /usr/share/keyrings/ros-archive-keyring.gpg
          # Add the repository with the new key
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          # Update package list with the new key
          sudo apt-get update
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          import-token: ${{ secrets.GITHUB_TOKEN }}
          # vcs-repo-file-url: build_depends.repos
          package-name: |
            stamp_dude
            stamp_dude_bringup
name: ci_jazzy

on:
  push:
    branches:
      - "jazzy"
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  ci:
    runs-on: ubuntu-latest
    if: |
      ((github.event.action == 'labeled') && (github.event.label.name == 'TESTING') && (github.base_ref == 'jazzy' )) ||
      ((github.event.action == 'synchronize') && (github.base_ref == 'jazzy') && contains(github.event.pull_request.labels.*.name, 'TESTING')) ||
      (github.ref_name == 'jazzy')
    container:
      image: osrf/ros:jazzy-desktop
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      
      - name: Build and Test
        shell: bash
        run: |
          # Source ROS 2 environment
          source /opt/ros/jazzy/setup.bash
          
          # Disable ROS apt repository to avoid GPG errors
          sudo mv /etc/apt/sources.list.d/ros2-latest.list /etc/apt/sources.list.d/ros2-latest.list.disabled || true
          
          # Update and install basic dependencies
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions
          
          # Build the workspace
          colcon build --symlink-install --packages-select stamp_dude stamp_dude_bringup
          
          # Run tests
          colcon test --packages-select stamp_dude stamp_dude_bringup
          colcon test-result --all --verbose
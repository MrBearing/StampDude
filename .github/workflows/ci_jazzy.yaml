name: ci_jazzy

on:
  push:
    branches:
      - "jazzy"
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  ci:
    runs-on: ubuntu-latest
    if: |
      ((github.event.action == 'labeled') && (github.event.label.name == 'TESTING') && (github.base_ref == 'jazzy' )) ||
      ((github.event.action == 'synchronize') && (github.base_ref == 'jazzy') && contains(github.event.pull_request.labels.*.name, 'TESTING')) ||
      (github.ref_name == 'jazzy')
    container:
      image: osrf/ros:jazzy-desktop
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      
      # Fix GPG key issue in the container
      - name: Update ROS 2 GPG Key
        run: |
          # Remove the invalid GPG key and update with the latest one
          sudo rm -f /usr/share/keyrings/ros-archive-keyring.gpg
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          # Update without checking signatures first
          sudo apt-get update -o Acquire::AllowInsecureRepositories=true || true
          # Now update normally
          sudo apt-get update
      
      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: jazzy
          import-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: |
            stamp_dude
            stamp_dude_bringup
          # Skip installing ROS since it's pre-installed in the container
          skip-tests: false
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc", "coverage-pytest"]
              },
              "test": {
                "mixin": ["coverage-pytest"]
              }
            }